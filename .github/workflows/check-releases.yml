name: Check Releases
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      send_notifications:
        description: Send ntfy notifications for newly found releases
        required: false
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: movie-release-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check titles and persist state to B2
        run: npm run check
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SEND_NOTIFICATIONS: ${{ github.event_name != 'workflow_dispatch' || inputs.send_notifications }}
