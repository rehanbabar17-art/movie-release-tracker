<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Release Radar</title><style>
:root{color-scheme:dark;font:16px/1.5 Inter,ui-sans-serif,system-ui;background:#090d16;color:#edf2fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#20244a 0,transparent 38%),#090d16;min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:36px 22px}.head{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{color:#9b9dfd;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}h1{font-size:clamp(32px,6vw,52px);line-height:1.05;margin:9px 0}p{color:#9aa8bb}.status{font-size:13px;color:#9aa8bb}.tabs{display:flex;gap:9px;margin:32px 0 20px;flex-wrap:wrap}.tab{border:1px solid #29354b;border-radius:11px;background:#111929;color:#c7d1e1;padding:10px 15px;cursor:pointer;font-weight:650}.tab.active{background:#625df5;border-color:#807bff;color:white}.tab small{opacity:.75;margin-left:5px}.list{display:grid;gap:12px}.card{display:grid;grid-template-columns:94px 1fr auto;align-items:center;gap:18px;padding:17px;background:#101827;border:1px solid #202d40;border-radius:16px}.date{color:#a8a8ff;font-weight:750}.kind{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#92a2b7}.title{font-size:18px;font-weight:720}.detail{color:#aab6c8;font-size:14px}.empty{padding:45px 22px;text-align:center;border:1px dashed #344056;border-radius:16px;color:#aab6c8}.link{color:#a9a6ff;text-decoration:none}.footer{margin-top:25px;font-size:12px;color:#77859a}@media(max-width:620px){.wrap{padding:25px 15px}.head{align-items:flex-start}.card{grid-template-columns:1fr;gap:5px}.date{grid-row:1}.title{grid-row:2}.kind{grid-row:3}.detail{grid-row:4}}
</style></head><body><main class="wrap"><div class="head"><div><div class="eyebrow">Your personal release calendar</div><h1>Release Radar</h1><p>Cinema premieres, digital drops, and the next episodes you care about.</p></div><div class="status" id="status">Loading…</div></div><nav class="tabs"><button class="tab active" data-days="7">Next 7 days</button><button class="tab" data-days="3">Next 3 days</button><button class="tab" data-days="0">Today</button></nav><section id="list" class="list"></section><div class="footer">Release dates are sourced from TMDB and may vary by country or platform. Dates shown use UTC calendar days. Add titles by editing your private B2 config.</div></main><script>
let releases=[];let days=7;const today=new Date().toISOString().slice(0,10);function render(){const end=new Date();end.setUTCDate(end.getUTCDate()+days);const max=end.toISOString().slice(0,10);const rows=releases.filter(r=>r.date>=today&&r.date<=max);document.querySelector('#list').innerHTML=rows.length?rows.map(r=>`<article class="card"><div class="date">${r.date===today?'Today':new Date(r.date+'T00:00:00Z').toLocaleDateString(undefined,{month:'short',day:'numeric',timeZone:'UTC'})}</div><div><div class="title">${esc(r.title)}</div><div class="detail">${esc(r.detail)}</div></div><div class="kind">${r.kind==='episode'?'Episode':r.kind==='cinema'?'Cinema':'Digital'}</div><a class="link" href="${esc(r.url)}" target="_blank" rel="noreferrer">Details ↗</a></article>`).join(''):`<div class="empty">No releases scheduled in this window yet.<br>Once you add your movies and shows, new dates will appear here.</div>`}function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelector('.tab.active')?.classList.remove('active');b.classList.add('active');days=Number(b.dataset.days);render()});fetch('/api/releases').then(r=>r.json()).then(d=>{releases=d.releases||[];document.querySelector('#status').textContent=d.checkedAt?'Last checked '+new Date(d.checkedAt).toLocaleString():'Not checked yet';render()}).catch(()=>document.querySelector('#status').textContent='Could not load releases');
</script></body></html>
